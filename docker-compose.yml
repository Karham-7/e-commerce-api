services:

  db:
    image: postgres:16
    container_name: shop_db
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: shop_app
    ports:
      - "8000:8000"
    depends_on:
      - db